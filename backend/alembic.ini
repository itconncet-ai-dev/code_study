# Alembic Configuration File
# AI Code Learning Platform

[alembic]
# Path to migration scripts
script_location = alembic

# Template for new migration files (Mako template)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# Prepend sys.path for importing the application modules
prepend_sys_path = .

# Timezone for file_template timestamps (leave empty for local time)
# timezone =

# Max length of characters for the "slug" portion of revision names
truncate_slug_length = 40

# Set to True to require a revision to have a description
# revision_environment = false

# Set to 'true' to run the environment during migration generation
# (required for autogenerate support)
# revision_environment = false

# Set to True to allow calls to context.execute() to fail silently
# context_execution_unbound = false

# Version path for multiple version directories
# version_path_separator = os  # Use os.pathsep. Default configuration.

# Output encoding
output_encoding = utf-8

# Database URL - placeholder, actual value loaded from environment in env.py
# Format: postgresql://user:password@host:port/database
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Automatically format migration files with Black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[handler_file]
class = FileHandler
args = ('alembic.log',)
level = INFO
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
